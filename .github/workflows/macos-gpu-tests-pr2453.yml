name: macOS GPU and VideoToolbox tests

on:
  push:
    branches:
      - ci/macos-gpu-tests-pr2453

permissions:
  contents: read

jobs:
  macos-tests:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-cache

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          clang++ --version

      - name: Install build dependencies
        run: |
          brew install autoconf autoconf-archive automake libtool vulkan-loader molten-vk
          cmake --version
          ninja --version

      - name: Check Metal device
        run: |
          echo "Runner architecture: $RUNNER_ARCH"
          device="$(osascript -l JavaScript -e 'ObjC.import("Metal"); var d = $.MTLCreateSystemDefaultDevice(); d ? ObjC.unwrap(d.name) : "NO_METAL_DEVICE";')"
          echo "Metal device: $device"
          if [[ "$device" == "NO_METAL_DEVICE" ]]; then
            echo "::error::No Metal GPU is visible to this runner"
            exit 1
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-macos-arm64-release-tests-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**', 'cmake/triplets/release-only/arm64-osx.cmake') }}
          restore-keys: |
            vcpkg-macos-arm64-release-tests-
            vcpkg-macos-arm64-release-

      - name: Set up pinned vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout dc1232a6e05dcc49703091e83743e3b4df9b9b7c
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure tests
        run: cmake --preset macos-release -DBUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build-macos-release --target lichtfeld_tests --parallel 2

      - name: Run GPU and VideoToolbox tests
        run: |
          icd="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
          test -f "$icd"
          VK_DRIVER_FILES="$icd" ctest --test-dir build-macos-release -R '^lichtfeld_tests$' --output-on-failure
